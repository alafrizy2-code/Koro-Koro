name: Build Koro Koro TV APKs

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Generate release keystore for APK signing
        run: |
          keytool -genkey -v \
            -keystore /tmp/release.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass korokorotv \
            -keypass korokorotv \
            -dname "CN=Koro Koro TV, OU=AndroidTV, O=KoroKoro, L=Jakarta, ST=Jakarta, C=ID"

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: /tmp/release.jks
          STORE_PASSWORD: korokorotv
          KEY_PASSWORD: korokorotv
        run: gradle assembleDebug assembleRelease

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
